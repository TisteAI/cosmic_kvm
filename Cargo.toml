[workspace]
resolver = "2"
members = [
    "cosmic-kvm-daemon",
    "cosmic-kvm-input",
    "cosmic-kvm-protocol",
    "cosmic-kvm-ui",
    "cosmic-kvm-applet",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/TisteAI/cosmic_kvm"
authors = ["Your Name <your.email@example.com>"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Networking
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "0.26"

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# COSMIC libraries
libcosmic = { git = "https://github.com/pop-os/libcosmic.git" }
cosmic-config = { git = "https://github.com/pop-os/libcosmic.git" }
cosmic-theme = { git = "https://github.com/pop-os/libcosmic.git" }

# Wayland
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }

# Input handling
evdev = "0.12"

# D-Bus
zbus = "4.0"

# Service discovery
mdns-sd = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
